spring.application.name=library-management-system

# Secrets are NOT stored in this file (it is on GitHub). They come from secrets.properties next to pom.xml
# (ignored by git; copy secrets.example.properties to create it) or from environment variables.
spring.config.import=optional:file:./secrets.properties
server.port=9090
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/library_sys
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# Note: XAMPP ships MariaDB; Hibernate detects it as MySQL. Everything works, but row locks are written
# as plain SQL "SELECT ... FOR UPDATE" (see PaymentRepository) because Hibernate's generated lock syntax fails on MariaDB.

# ---- Auth settings ----
# Login token lifetime (24 hours)
app.jwt.expiration-ms=86400000
# Reset-password link lifetime
app.reset-token.expiration-minutes=15
# Frontend address used to build the reset-password link
app.frontend-url=http://localhost:5173

# Currency used for new subscription plans when none is sent (ISO code)
app.default-currency=MAD

# Overdue fines, in minor units (centimes): 500 = 5.00 MAD per late day, capped at 10000 = 100.00 MAD per loan
app.fine.overdue-per-day=500
app.fine.overdue-max=10000

# Reservations: how long a held copy waits for pickup, and how many active holds a user may have
app.reservation.pickup-hours=48
app.reservation.max-active-per-user=5

# Payments (simulated gateway): checkout page address, time to pay, declined attempts allowed
app.payment.checkout-base-url=http://localhost:9090/pay
app.payment.expiry-minutes=30
app.payment.max-attempts=3

# First admin account. The password comes from secrets.properties or the ADMIN_PASSWORD environment variable.
# If it is not set and no admin exists yet, a random password is generated and printed once in the log.
app.admin.email=${ADMIN_EMAIL:admin@library.local}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=Library Admin
# JWT signing secret: from secrets.properties or the JWT_SECRET environment variable (at least 32 characters).
# If missing, a random one is generated at startup and every login token stops working after a restart.
app.jwt.secret=${JWT_SECRET:}

# Brute-force protection: failed logins allowed per email+IP within the window, then 429 Too Many Requests
app.security.max-login-attempts=5
app.security.max-reset-requests=3
app.security.attempt-window-minutes=15

# Development only: also print password-reset and verification links in the log (handy for testing). Set false in production.
app.dev.log-reset-links=true

# ---- Email (Gmail SMTP). spring.mail.username / spring.mail.password come from secrets.properties ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Name shown as the sender
app.mail.from-name=Library
# Never email these reserved test domains (test users use them; mail there would only bounce)
app.mail.skip-domains=example.com,example.org,example.net
# Public address of this backend (used in links inside emails, e.g. email verification)
app.backend-url=http://localhost:9090
# Users must verify their email before buying a subscription
app.security.require-verified-email=true

# ---- Login with Google. app.google.client-id comes from secrets.properties ----
# Development only: test page with a Google button at /dev/google-login. Set false in production.
app.dev.google-test-page=true

# ---- Background jobs (cron: second minute hour day month weekday, server time zone) ----
app.jobs.enabled=true
app.jobs.overdue-loans.cron=0 5 0 * * *
app.jobs.expire-subscriptions.cron=0 10 0 * * *
app.jobs.expire-reservations.cron=0 */15 * * * *
app.jobs.expire-payments.cron=0 */5 * * * *
app.jobs.due-reminders.cron=0 0 9 * * *
app.jobs.cleanup-tokens.cron=0 30 3 * * *
# "Book due soon" reminder is emailed this many days before the due date
app.jobs.due-reminder-days-before=2
# Two scheduler threads, so a slow job (e.g. emails) never delays the others
spring.task.scheduling.pool.size=2
