# Used by every test (@ActiveProfiles("test")). Overrides application.properties.

# A SEPARATE database, created if missing and rebuilt empty on every test run.
# Your real library_sys database is never touched (TestSupport also checks this before any test runs).
spring.datasource.url=jdbc:mysql://localhost:3306/library_sys_test?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# No background jobs, no dev pages, no links in the log during tests.
app.jobs.enabled=false
app.dev.log-reset-links=false
app.dev.google-test-page=false

# Tests never send real email (EmailService is also replaced by a mock in TestSupport).
spring.mail.username=
spring.mail.password=

# Fixed test values (only used by the test database)
app.admin.password=TestAdmin123
app.jwt.secret=test-only-secret-key-for-junit-0123456789abcdef

logging.level.org.hibernate.SQL=warn
