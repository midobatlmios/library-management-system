spring.application.name=library-management-system
server.port=9090
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/library_sys
spring.datasource.username=root
spring.datasource.password=

# ---- Auth settings ----
# Login token lifetime (24 hours)
app.jwt.expiration-ms=86400000
# Reset-password link lifetime
app.reset-token.expiration-minutes=15
# Frontend address used to build the reset-password link
app.frontend-url=http://localhost:5173

# First admin account, created at startup if missing.
# Override with the ADMIN_EMAIL / ADMIN_PASSWORD environment variables; change the defaults before going live.
app.admin.email=${ADMIN_EMAIL:admin@library.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=Library Admin