# Copy this file to secrets.properties (same folder as pom.xml) and fill in real values.
# secrets.properties is ignored by git; never put real secrets in this example file.

# JWT signing secret: any random text of at least 32 characters.
# PowerShell to generate one:  [Convert]::ToBase64String((1..48 | % { Get-Random -Max 256 }))
app.jwt.secret=

# Password for the admin account (admin@library.local). At least 8 characters, with letters and digits.
app.admin.password=

# MySQL password (leave empty for the default XAMPP root user)
spring.datasource.password=
